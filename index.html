  <link id="favicon-32" rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link id="favicon-16" rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#065f46" />
  <title>data-dz - Données ouvertes sur l'Algérie</title>
  <meta name="description" data-rh="true"
    content="Pharmacies, écoles, climat… Cherche, visualise et télécharge gratuitement les données de ta wilaya. Open source, fait par des Algériens." />
  <meta property="og:title" data-rh="true" content="data-dz - Données ouvertes sur l'Algérie" />
  <meta property="og:description" data-rh="true"
    content="Pharmacies, écoles, climat… Cherche, visualise et télécharge gratuitement les données de ta wilaya. Open source, fait par des Algériens." />
  <meta property="og:site_name" content="data-dz" />
  <meta property="og:image" data-rh="true" content="https://www.data-dz.com/og-data-dz-v2.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="data-dz : toute l'Algérie en chiffres et en cartes" />
  <meta property="og:locale" data-rh="true" content="fr_FR" />
  <meta property="og:url" data-rh="true" content="https://www.data-dz.com" />
  <meta property="og:type" data-rh="true" content="website" />

  <meta name="twitter:card" data-rh="true" content="summary_large_image" />
  <meta name="twitter:title" data-rh="true" content="data-dz - Données ouvertes sur l'Algérie" />
  <meta name="twitter:description" data-rh="true"
    content="Pharmacies, écoles, climat… Cherche, visualise et télécharge gratuitement les données de ta wilaya. Open source, fait par des Algériens." />
  <meta name="twitter:image" data-rh="true" content="https://www.data-dz.com/og-data-dz-v2.jpg" />

  <!--
    data-rh="true" (balises ci-dessus) : react-helmet-async les remplace par celles de chaque page (description d'une fiche…).
    Sans cet attribut, la description générale restait en premier et Google l'affichait pour toutes les pages.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "data-dz",
      "url": "https://www.data-dz.com/",
      "inLanguage": ["fr", "en", "ar"],
      "publisher": { "@type": "Organization", "name": "New Algeria", "url": "https://newalgeria.org" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://www.data-dz.com/?q={search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!--
    Évite le « flash » au premier affichage : thème et langue sont appliqués avant le chargement de React,
    avec les mêmes règles que src/hooks/use-theme.tsx et i18next (?lng=, choix mémorisé, langue de l'appareil, sinon fr).
  -->
  <style>html.dark { background-color: #020817; color-scheme: dark; }</style>
  <script>
    (function () {
      var racine = document.documentElement;
      var lire = function (cle) { try { return localStorage.getItem(cle); } catch (e) { return null; } };
      var theme = lire("theme");
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (theme === "dark") racine.classList.add("dark");

      var langues = ["fr", "en", "ar"];
      var candidats = [];
      try { candidats.push(new URLSearchParams(location.search).get("lng")); } catch (e) {}
      candidats.push(lire("i18nextLng"));
      candidats = candidats.concat(navigator.languages || [navigator.language]);
      for (var i = 0; i < candidats.length; i++) {
        var code = (candidats[i] || "").slice(0, 2).toLowerCase();
        if (langues.indexOf(code) !== -1) {
          racine.lang = code;
          racine.dir = code === "ar" ? "rtl" : "ltr";
          return;
        }
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
